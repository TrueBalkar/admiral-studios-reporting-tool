services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: admiral
      POSTGRES_PASSWORD: admiral
      POSTGRES_DB: admiral
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admiral"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://admiral:admiral@db:5432/admiral
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_DAYS: "7"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      COOKIE_NAME: auth-token
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ENVIRONMENT: production
    ports:
      - "8000:8000"

volumes:
  pgdata:
